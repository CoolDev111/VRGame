!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Grappling Hook</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{overflow:hidden;background:#000}
        #canvas{display:block;width:100vw;height:100vh}
        #hud{
            position:absolute;top:10px;left:10px;
            color:#0f0;font:12px/1.5 monospace;
            background:rgba(0,0,0,.7);padding:8px 12px;
            border:1px solid #0a0;border-radius:4px;
            pointer-events:none;z-index:10;
        }
        #controls-hint{
            position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
            color:#888;font:11px monospace;text-align:center;
            background:rgba(0,0,0,.5);padding:6px 14px;border-radius:4px;
            pointer-events:none;z-index:10;white-space:pre-line;
        }
        #vr-button{
            position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
            padding:12px 28px;font:700 15px sans-serif;
            background:#0066cc;color:#fff;border:none;border-radius:6px;
            cursor:pointer;z-index:11;
        }
        #vr-button:disabled{background:#444;color:#888;cursor:not-allowed}
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
    <div id="status">Init...</div>
    <div>L: <span id="lg">off</span> R: <span id="rg">off</span></div>
    <div><span id="vel">0.0</span> m/s | <span id="alt">0.0</span> m</div>
</div>
<div id="controls-hint">Desktop: WASD + mouse look (click) | Space/Enter grapple | Q/E reel</div>
<div id="loader" style="position:fixed;inset:0;background:#111122;display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px">
    <div style="color:#0f0;font:16px monospace">LOADING</div>
    <div style="color:#555;font:12px monospace" id="load-status">three.js...</div>
</div>
<button id="vr-button">Enter VR</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

// ===== PRE-ALLOCATED TEMP VECTORS (zero allocation in hot path) =====
const _v = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _v3 = new THREE.Vector3();
const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _dummy = new THREE.Object3D();
const _c = new THREE.Color();
const _up = new THREE.Vector3(0, 1, 0);

// ===== SEEDED RNG =====
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashChunk(cx,cz){let h=cx*374761393+cz*668265263;h=(h^(h>>13))*1274126177;return h^(h>>16)}

// ===== CONSTANTS =====
const GRAVITY    = -9.81;
const SPRING_K   = 400;
const DAMPING    = 8;
const REEL_RATE  = 4.0;
const ROPE_MIN   = 0.5;
const MOVE_SPEED = 12;
const TURN_SPEED = 2.0;
const DEADZONE   = 0.15;

const CHUNK_N    = 5;            // 5x5 buildings per chunk
const SPACING    = 12;           // world units between centers
const CHUNK_W    = CHUNK_N * SPACING;  // 60
let   LOAD_DIST  = 0;            // Start with just spawn chunk, expand after first frames
const MAX_INST   = 200;          // max visible building instances
const DENSITY    = 0.35;
const MIN_H      = 8;
const MAX_H      = 55;
const MIN_SZ     = 3;
const MAX_SZ     = 6;

// ===== RENDERER (Quest-optimized) =====
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);  // Native res only — no 2x on Quest
renderer.xr.enabled = true;

// ===== SCENE =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111122);
scene.fog = new THREE.Fog(0x111122, 40, 160);  // Linear fog, cheap

// ===== CAMERA + RIG =====
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.5, 200);
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

// ===== LIGHTING (minimal) =====
scene.add(new THREE.AmbientLight(0x556688, 0.8));
const sun = new THREE.DirectionalLight(0xffeedd, 0.6);
sun.position.set(30, 50, 20);
scene.add(sun);
// No shadows, no point lights

// ===== INSTANCED MESH FOR ALL BUILDINGS (1 draw call total) =====
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const bldgMat = new THREE.MeshLambertMaterial({color:0x334455});
const bldgMesh = new THREE.InstancedMesh(boxGeo, bldgMat, MAX_INST);
bldgMesh.count = 0;
scene.add(bldgMesh);

// Instance color buffer
bldgMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX_INST * 3), 3);
bldgMesh.instanceColor.setUsage(THREE.StaticDrawUsage);

// ===== CHUNK DATA (plain objects, no Three.js objects) =====
const chunkData = new Map(); // "cx,cz" -> [{x,z,w,h,d,hue,lit}]
let activeChunks = new Set();
let chunksDirty = true;

function genChunkData(cx, cz) {
    const key = cx + ',' + cz;
    if (chunkData.has(key)) return;
    const rng = mulberry32(hashChunk(cx, cz));
    const arr = [];
    const bx = cx * CHUNK_W;
    const bz = cz * CHUNK_W;
    for (let lx = 0; lx < CHUNK_N; lx++) {
        for (let lz = 0; lz < CHUNK_N; lz++) {
            if (rng() > DENSITY) continue;
            const h = MIN_H + rng() * (MAX_H - MIN_H);
            const sz = MIN_SZ + rng() * (MAX_SZ - MIN_SZ);
            arr.push({
                x: bx + lx * SPACING + (rng()-0.5)*2,
                z: bz + lz * SPACING + (rng()-0.5)*2,
                w: sz, h: h, d: sz,
                hue: 0.55 + (rng()-0.5)*0.1,
                lit: 0.12 + rng()*0.15
            });
        }
    }
    chunkData.set(key, arr);
}

function updateChunks() {
    const pcx = Math.floor(player.x / CHUNK_W);
    const pcz = Math.floor(player.z / CHUNK_W);
    const needed = new Set();
    for (let dx = -LOAD_DIST; dx <= LOAD_DIST; dx++) {
        for (let dz = -LOAD_DIST; dz <= LOAD_DIST; dz++) {
            const k = (pcx+dx)+','+(pcz+dz);
            needed.add(k);
            if (!chunkData.has(k)) genChunkData(pcx+dx, pcz+dz);
        }
    }
    // Check if changed
    if (needed.size === activeChunks.size) {
        let same = true;
        for (const k of needed) { if (!activeChunks.has(k)) { same=false; break; } }
        if (same) return;
    }
    activeChunks = needed;
    chunksDirty = true;
}

function rebuildInstances() {
    let idx = 0;
    for (const key of activeChunks) {
        const data = chunkData.get(key);
        if (!data) continue;
        for (let i = 0; i < data.length; i++) {
            if (idx >= MAX_INST) break;
            const b = data[i];
            _dummy.position.set(b.x, b.h * 0.5, b.z);
            _dummy.scale.set(b.w, b.h, b.d);
            _dummy.updateMatrix();
            bldgMesh.setMatrixAt(idx, _dummy.matrix);
            _c.setHSL(b.hue, 0.3, b.lit);
            bldgMesh.instanceColor.setXYZ(idx, _c.r, _c.g, _c.b);
            idx++;
        }
        if (idx >= MAX_INST) break;
    }
    bldgMesh.count = idx;
    bldgMesh.instanceMatrix.needsUpdate = true;
    bldgMesh.instanceColor.needsUpdate = true;
}

// ===== GROUND =====
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 600),
    new THREE.MeshLambertMaterial({color:0x1a2a1a})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.1;
scene.add(ground);

// ===== ROPE VISUALS (minimal) =====
function makeRope(color) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({color}));
    l.visible = false;
    l.frustumCulled = false;
    scene.add(l);
    return l;
}
const ropeL = makeRope(0x00ff88);
const ropeR = makeRope(0x00ff88);

function updateRope(line, active, anchor) {
    if (!active) { line.visible = false; return; }
    line.visible = true;
    const p = line.geometry.attributes.position.array;
    p[0]=player.x; p[1]=player.y; p[2]=player.z;
    p[3]=anchor.x; p[4]=anchor.y; p[5]=anchor.z;
    line.geometry.attributes.position.needsUpdate = true;
}

// ===== PLAYER STATE =====
const player = {x:0, y:20, z:0, vx:0, vy:0, vz:0};
const left  = {active:false, ax:0,ay:0,az:0, len:0, reel:false};
const right = {active:false, ax:0,ay:0,az:0, len:0, reel:false};

// ===== RAYCASTER =====
const ray = new THREE.Raycaster();
ray.far = 80;

function grappleRay(ox, oy, oz, dx, dy, dz) {
    _v.set(ox, oy, oz);
    _v2.set(dx, dy, dz).normalize();
    ray.set(_v, _v2);
    const hits = ray.intersectObject(bldgMesh);
    return hits.length > 0 ? hits[0] : null;
}

// ===== PHYSICS =====
function physics(dt) {
    dt = Math.min(dt, 0.025);
    const p = player;

    // Spring tension from left
    let fx=0, fy=0, fz=0;
    if (left.active) {
        const dx=p.x-left.ax, dy=p.y-left.ay, dz=p.z-left.az;
        const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
        if (dist > left.len && dist > 0.001) {
            const inv=1/dist;
            const ux=dx*inv, uy=dy*inv, uz=dz*inv;
            const vAlong=p.vx*ux+p.vy*uy+p.vz*uz;
            const f=-(SPRING_K*(dist-left.len)+DAMPING*vAlong);
            fx+=ux*f; fy+=uy*f; fz+=uz*f;
        }
    }
    if (right.active) {
        const dx=p.x-right.ax, dy=p.y-right.ay, dz=p.z-right.az;
        const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
        if (dist > right.len && dist > 0.001) {
            const inv=1/dist;
            const ux=dx*inv, uy=dy*inv, uz=dz*inv;
            const vAlong=p.vx*ux+p.vy*uy+p.vz*uz;
            const f=-(SPRING_K*(dist-right.len)+DAMPING*vAlong);
            fx+=ux*f; fy+=uy*f; fz+=uz*f;
        }
    }

    // Integrate
    p.vy += GRAVITY * dt;
    p.vx += fx * dt;
    p.vy += fy * dt;
    p.vz += fz * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;

    // Reel
    if (left.active && left.reel) left.len = Math.max(ROPE_MIN, left.len - REEL_RATE*dt);
    if (right.active && right.reel) right.len = Math.max(ROPE_MIN, right.len - REEL_RATE*dt);

    // Ground
    if (p.y < 0.5) { p.y=0.5; if(p.vy<0) p.vy=0; p.vx*=0.9; p.vz*=0.9; }

    // Respawn
    if (p.y < -50) {
        p.x=0; p.y=20; p.z=0; p.vx=p.vy=p.vz=0;
        left.active=right.active=false;
    }
}

// ===== CONTROLLER VISUALS (children of rig) =====
const ctrlGeo = new THREE.BoxGeometry(0.04, 0.12, 0.06);
const ctrlMatL = new THREE.MeshLambertMaterial({color:0x00ff66, emissive:0x005522});
const ctrlMatR = new THREE.MeshLambertMaterial({color:0x00ff66, emissive:0x005522});
const ctrlL = new THREE.Mesh(ctrlGeo, ctrlMatL);
const ctrlR = new THREE.Mesh(ctrlGeo, ctrlMatR);
ctrlL.visible = ctrlR.visible = false;
ctrlL.frustumCulled = ctrlR.frustumCulled = false;
rig.add(ctrlL);
rig.add(ctrlR);

// Stored base-space poses
const poseL = {x:0,y:0,z:0, qx:0,qy:0,qz:0,qw:1};
const poseR = {x:0,y:0,z:0, qx:0,qy:0,qz:0,qw:1};

// ===== XR STATE =====
let xrSession = null;
let xrBaseSpace = null;
let isVR = false;
let rigYaw = 0;
let currentFrame = null;

// ===== GRAPPLE HELPERS =====
function attachGrapple(isLeft, hit) {
    const dx=player.x-hit.point.x, dy=player.y-hit.point.y, dz=player.z-hit.point.z;
    const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
    const g = isLeft ? left : right;
    g.active = true;
    g.ax = hit.point.x; g.ay = hit.point.y; g.az = hit.point.z;
    g.len = dist;
}

function worldPosFromBase(bx, by, bz) {
    const cosY = Math.cos(rigYaw), sinY = Math.sin(rigYaw);
    return {
        x: bx*cosY - bz*sinY + player.x,
        y: by + player.y,
        z: bx*sinY + bz*cosY + player.z
    };
}

function worldDirFromBase(dx, dy, dz) {
    const cosY = Math.cos(rigYaw), sinY = Math.sin(rigYaw);
    return {
        x: dx*cosY - dz*sinY,
        y: dy,
        z: dx*sinY + dz*cosY
    };
}

function getGripWorld(inputSource) {
    if (!currentFrame || !xrBaseSpace || !inputSource.gripSpace) return null;
    const gp = currentFrame.getPose(inputSource.gripSpace, xrBaseSpace);
    if (!gp) return null;
    const m4 = _m.fromArray(gp.transform.matrix);
    const pos = _v.setFromMatrixPosition(m4);
    const quat = _q.setFromRotationMatrix(m4);
    const fwd = _v3.set(0,0,-1).applyQuaternion(quat);
    return { bx:pos.x, by:pos.y, bz:pos.z, fx:fwd.x, fy:fwd.y, fz:fwd.z };
}

function tryGrapple(isLeft, ox,oy,oz, dx,dy,dz) {
    let hit = grappleRay(ox,oy,oz, dx,dy,dz);
    if (!hit) {
        // Try slightly downward
        hit = grappleRay(ox,oy,oz, dx, dy-0.3, dz);
    }
    if (hit) attachGrapple(isLeft, hit);
}

// ===== XR EVENT HANDLERS =====
function onGrappleStart(e) {
    const src = e.inputSource;
    if (!src.handedness || src.handedness==='none') return;
    const isL = src.handedness==='left';
    const grip = getGripWorld(src);
    if (grip) {
        const wp = worldPosFromBase(grip.bx, grip.by, grip.bz);
        const wd = worldDirFromBase(grip.fx, grip.fy, grip.fz);
        tryGrapple(isL, wp.x,wp.y,wp.z, wd.x,wd.y,wd.z);
    }
}
function onGrappleEnd(e) {
    const isL = e.inputSource.handedness==='left';
    (isL?left:right).active = false;
}
function onReelStart(e) { (e.inputSource.handedness==='left'?left:right).reel = true; }
function onReelEnd(e) { (e.inputSource.handedness==='left'?left:right).reel = false; }

// ===== SESSION =====
async function startSession(session) {
    xrSession = session;
    isVR = true;
    session.addEventListener('end', endSession);

    // FIX: Remove the manual XRWebGLLayer creation. 
    // Let Three.js automatically handle makeXRCompatible() and the baseLayer.
    renderer.xr.setSession(session);

    // Try local-floor first, fall back to viewer (some PCVR setups only support viewer)
    try {
        xrBaseSpace = await session.requestReferenceSpace('local-floor');
    } catch(_) {
        xrBaseSpace = await session.requestReferenceSpace('viewer');
    }
    
    // Pass the reference space to Three.js and keep a local copy for our custom grapple math
    renderer.xr.setReferenceSpace(xrBaseSpace);

    player.x=0; player.y=20; player.z=0;
    player.vx=player.vy=player.vz=0;
    left.active=right.active=false;
    rigYaw=0;
    rig.quaternion.identity();
    ctrlL.visible = ctrlR.visible = true;

    session.addEventListener('selectstart', onGrappleStart);
    session.addEventListener('selectend', onGrappleEnd);
    session.addEventListener('squeezestart', onReelStart);
    session.addEventListener('squeezeend', onReelEnd);

    document.getElementById('controls-hint').textContent = 'L-stick move · R-stick turn · Triggers grapple · Grips reel';
    setStatus('VR Active');
}

function endSession() {
    xrSession=null; xrBaseSpace=null; isVR=false;
    ctrlL.visible=ctrlR.visible=false;
    left.active=right.active=false;
    document.getElementById('controls-hint').textContent = 'WASD + mouse look (click) | Space/Enter grapple | Q/E reel';
    setStatus('Desktop');
    document.getElementById('vr-button').textContent = 'Enter VR';
    document.getElementById('vr-button').onclick = requestVR;
}

// ===== DESKTOP CONTROLS =====
const keys = {};
let dYaw=0, dPitch=0;

window.addEventListener('keydown', e => {
    keys[e.code]=true;
    if(e.code==='Space'&&!e.repeat){e.preventDefault(); desktopGrapple(true)}
    if(e.code==='Enter'&&!e.repeat){e.preventDefault(); desktopGrapple(false)}
    if(e.code==='KeyQ') left.reel=true;
    if(e.code==='KeyE') right.reel=true;
});
window.addEventListener('keyup', e => {
    keys[e.code]=false;
    if(e.code==='Space') left.active=false;
    if(e.code==='Enter') right.active=false;
    if(e.code==='KeyQ') left.reel=false;
    if(e.code==='KeyE') right.reel=false;
});
canvas.addEventListener('click', () => {
    if(!isVR) canvas.requestPointerLock && canvas.requestPointerLock();
});
window.addEventListener('mousemove', e => {
    if(document.pointerLockElement===canvas){
        dYaw-=e.movementX*0.003;
        dPitch-=e.movementY*0.003;
        dPitch=Math.max(-1.5,Math.min(1.5,dPitch));
    }
});

function desktopGrapple(isL) {
    const cosY=Math.cos(dYaw), sinY=Math.sin(dYaw);
    const fx = -sinY, fz = -cosY;
    const fy = Math.sin(dPitch);
    const flen = Math.sqrt(fx*fx+fy*fy+fz*fz);
    tryGrapple(isL, player.x, player.y+0.5, player.z, fx/flen, fy/flen, fz/flen);
}

// ===== HUD (throttled) =====
const elStatus = document.getElementById('status');
const elLG = document.getElementById('lg');
const elRG = document.getElementById('rg');
const elVel = document.getElementById('vel');
const elAlt = document.getElementById('alt');
let hudTick = 0;

function setStatus(t) { elStatus.textContent = t; }
function updateHUD() {
    hudTick++;
    if (hudTick % 10 !== 0) return; // ~6 updates/sec at 60fps
    elLG.textContent = left.active ? 'ON' : 'off';
    elLG.style.color = left.active ? '#ff0' : '#0f0';
    elRG.textContent = right.active ? 'ON' : 'off';
    elRG.style.color = right.active ? '#ff0' : '#0f0';
    const spd = Math.sqrt(player.vx*player.vx+player.vy*player.vy+player.vz*player.vz);
    elVel.textContent = spd.toFixed(1);
    elAlt.textContent = player.y.toFixed(1);
}

// ===== MAIN LOOP =====
let lastT = performance.now();
let warmFrames = 0;

function animate(now, frame) {
    // NO requestAnimationFrame here! setAnimationLoop handles it.
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    currentFrame = frame || null;

    if (isVR && frame) {
        updateVR(frame, dt);
    } else {
        updateDesktop(dt);
    }

    // Physics (max 2 sub-steps)
    const steps = Math.min(Math.ceil(dt * 60), 3);
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) physics(sdt);

    // Expand load radius after warmup
    if (LOAD_DIST < 1) {
        warmFrames++;
        if (warmFrames > 30) LOAD_DIST = 1;
    }
    // Chunks (only rebuild instances when dirty)
    updateChunks();
    if (chunksDirty) { rebuildInstances(); chunksDirty = false; }

    // Rope visuals
    updateRope(ropeL, left.active, left);
    updateRope(ropeR, right.active, right);

    // Ground follows player
    ground.position.x = player.x;
    ground.position.z = player.z;

    renderer.render(scene, camera);
    updateHUD();
}

function updateVR(frame, dt) {
    if (!frame.session || !frame.session.inputSources) return;
    const sources = frame.session.inputSources;

    for (let i = 0; i < sources.length; i++) {
        const src = sources[i];
        if (!src.gripSpace) continue;
        const gp = frame.getPose(src.gripSpace, xrBaseSpace);
        if (!gp) continue;

        const m4 = _m.fromArray(gp.transform.matrix);
        const pos = _v.setFromMatrixPosition(m4);
        const quat = _q.setFromRotationMatrix(m4);

        const isL = src.handedness === 'left';
        const pose = isL ? poseL : poseR;
        const ctrl = isL ? ctrlL : ctrlR;
        pose.x=pos.x; pose.y=pos.y; pose.z=pos.z;
        pose.qx=quat.x; pose.qy=quat.y; pose.qz=quat.z; pose.qw=quat.w;
        ctrl.position.copy(pos);
        ctrl.quaternion.copy(quat);

        // Thumbstick input
        if (src.gamepad && src.gamepad.axes.length >= 2) {
            const ax = src.gamepad.axes;
            if (isL && ax.length >= 2) {
                // Movement
                const sx = Math.abs(ax[0])>DEADZONE ? ax[0] : 0;
                const sy = Math.abs(ax[1])>DEADZONE ? ax[1] : 0;
                if (sx!==0||sy!==0) {
                    // Get HMD forward
                    let hfx=-Math.sin(rigYaw), hfz=-Math.cos(rigYaw);
                    const vp = frame.getViewerPose(xrBaseSpace);
                    if (vp && vp.views[0]) {
                        const vm = _m.fromArray(vp.views[0].transform.matrix);
                        const vq = _q.setFromRotationMatrix(vm);
                        _v3.set(0,0,-1).applyQuaternion(vq);
                        _v3.y=0; _v3.normalize();
                        hfx=_v3.x; hfz=_v3.z;
                    }
                    // Right = cross(forward, up) = (-hfz, 0, hfx)
                    const rx = -hfz, rz = hfx;
                    const mx = hfx*(-sy) + rx*sx;
                    const mz = hfz*(-sy) + rz*sx;
                    const ml = Math.sqrt(mx*mx+mz*mz) || 1;
                    player.vx = mx/ml * MOVE_SPEED;
                    player.vz = mz/ml * MOVE_SPEED;
                } else {
                    player.vx *= 0.85;
                    player.vz *= 0.85;
                }
            }
            if (!isL && ax.length >= 4) {
                // Right stick turning
                const tx = Math.abs(ax[2])>DEADZONE ? ax[2] : 0;
                if (tx!==0) {
                    rigYaw += tx * TURN_SPEED * dt;
                    rig.quaternion.setFromAxisAngle(_up, rigYaw);
                }
            }
        }
    }

    // Move rig to physics position
    rig.position.set(player.x, player.y, player.z);
}

function updateDesktop(dt) {
    rig.position.set(0,0,0);
    rig.quaternion.identity();

    camera.position.set(player.x, player.y, player.z);
    camera.rotation.order = 'YXZ';
    camera.rotation.set(dPitch, dYaw, 0);

    const cosY=Math.cos(dYaw), sinY=Math.sin(dYaw);
    let mx=0, mz=0;
    if(keys['KeyW']) mz-=1;
    if(keys['KeyS']) mz+=1;
    if(keys['KeyA']) mx-=1;
    if(keys['KeyD']) mx+=1;
    if(mx||mz){
        const rx=mx*cosY-mz*sinY, rz=mx*sinY+mz*cosY;
        const l=Math.sqrt(rx*rx+rz*rz)||1;
        player.vx=rx/l*MOVE_SPEED;
        player.vz=rz/l*MOVE_SPEED;
    } else {
        player.vx*=0.88;
        player.vz*=0.88;
    }
}

// ===== START =====
renderer.setAnimationLoop(animate);

// VR button — never disable it; isSessionSupported lies on PCVR/Link
const vrBtn = document.getElementById('vr-button');
let vrReady = false;

async function requestVR() {
    vrBtn.textContent = 'Connecting...';
    vrBtn.disabled = true;
    try {
        // Try local-floor first (best for room-scale)
        let s = null;
        try {
            s = await navigator.xr.requestSession('immersive-vr', {
                requiredFeatures: ['local-floor']
            });
        } catch(_) {
            // Fallback: viewer reference space (works on more PCVR setups)
            s = await navigator.xr.requestSession('immersive-vr', {
                requiredFeatures: ['viewer']
            });
        }
        await startSession(s);
        vrReady = true;
        vrBtn.textContent = 'Exit VR';
        vrBtn.onclick = () => s.end();
    } catch(e) {
        console.error('VR failed:', e);
        const msg = e.message || String(e);
        // Show useful diagnostics
        if (msg.includes('NotSupportedError') || msg.includes('required features'))
            setStatus('VR: no headset found. Use Quest standalone browser, or Chrome+Link on PC.');
        else if (msg.includes('NotAllowedError') || msg.includes('permission'))
            setStatus('VR: permission denied. Allow VR access in browser settings.');
        else
            setStatus('VR error: ' + msg.slice(0, 60));
        vrBtn.textContent = 'Enter VR';
        vrBtn.disabled = false;
    }
}
vrBtn.addEventListener('click', requestVR);

// Lightweight check — just update label, never block the button
if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-vr').then(ok => {
        if (ok) {
            vrBtn.textContent = 'Enter VR';
            setStatus('VR detected');
        } else {
            // Don't disable! PCVR/Link often reports false but works
            vrBtn.textContent = 'Enter VR (try)';
            setStatus('VR not detected — click button to try anyway');
        }
    }).catch(() => {
        vrBtn.textContent = 'Enter VR (try)';
        setStatus('WebXR present — click button to attempt VR');
    });
} else {
    vrBtn.textContent = 'No WebXR API';
    vrBtn.disabled = true;
    setStatus('Browser has no WebXR. Use Chrome/Edge on PC or Quest standalone browser.');
}

window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

// Defer chunk loading — first frame renders empty scene (instant VR entry)

// Hide loader once Three.js is ready
const loader = document.getElementById('loader');
if(loader) loader.style.display = 'none';
setStatus('Ready');
</script>
